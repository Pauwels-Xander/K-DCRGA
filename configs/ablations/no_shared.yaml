# RQ3 ablation: full K-DCRGA minus the shared two-hop view.
base: ../base.yaml

model:
  num_hops: 3
  use_shared_view: false
  use_hierarchical: true

training:
  max_epochs: 30
  early_stop_patience: 10
  batch_size: 128        # full 5-view KDCRGA OOMs at 256 on 8GB; 128 profiled safe (preflight 2026-06-08)
